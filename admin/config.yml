backend:
  name: git-gateway
  branch: main

locale: 'ar'

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "hero"
    label: "الهيرو"
    files:
      - name: "hero"
        label: "السلايدر"
        file: "content/hero.json"
        fields:
          - label: "الشرائح"
            name: "slides"
            widget: "list"
            fields:
              - { label: "العنوان", name: "title", widget: "string" }
              - { label: "الوصف", name: "desc", widget: "text" }
              - { label: "الصورة", name: "image", widget: "image" }
              
  - name: "services"
    label: "الخدمات"
    files:
      - name: "services"
        label: "الخدمات"
        file: "content/services.json"
        fields:
          - label: "البطاقات"
            name: "items"
            widget: "list"
            fields:
              - { label: "العنوان", name: "title", widget: "string" }
              - { label: "الوصف", name: "desc", widget: "text" }

  - name: "projects"
    label: "المشاريع"
    files:
      - name: "projects"
        label: "قائمة المشاريع"
        file: "content/projects.json"
        fields:
          - label: "المشاريع"
            name: "items"
            widget: "list"
            fields:
              - { label: "العنوان", name: "title", widget: "string" }
              - { label: "الوصف", name: "desc", widget: "text" }
              - { label: "التصنيف", name: "type", widget: "string" }
              - { label: "الصورة", name: "image", widget: "image" }
              - { label: "المبلغ", name: "amount", widget: "string" }